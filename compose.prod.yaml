name: ${STACK_NAME:-sc-hauling}-prod

services:
  php:
    container_name: ${STACK_NAME:-sc-hauling}_php
    image: ${IMAGE:-ghcr.io/n445/star-citizen-hauling-manager}:${TAG:-main}
    restart: unless-stopped
    user: ${APP_UID:-1000}:${APP_GID:-1000}
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      HOME: /tmp
      XDG_DATA_HOME: /tmp
      XDG_CONFIG_HOME: /tmp
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        @immutable path /assets/*
        header @immutable Cache-Control "public, max-age=31536000, immutable"
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_drop: [ALL]
    # Le binaire frankenphp porte cap_net_bind_service=ep : sans elle le noyau refuse de l'exécuter.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      # Mode explicite, sinon Docker recopie les droits du point de montage (root:root 755).
      - type: tmpfs
        target: /app/var
        tmpfs:
          mode: 01777
      # Sessions PHP persistantes : sans ce volume chaque mise à jour déconnecte tout le monde.
      - sessions_data:/sessions
    depends_on:
      database: { condition: service_healthy }
    networks: [app, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-main_traefik}
      - traefik.http.services.${STACK_NAME:-sc-hauling}.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME:-sc-hauling}.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${STACK_NAME:-sc-hauling}.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.${STACK_NAME:-sc-hauling}.tls=true
      - traefik.http.routers.${STACK_NAME:-sc-hauling}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.${STACK_NAME:-sc-hauling}.middlewares=${STACK_NAME:-sc-hauling}-secure@docker

      - traefik.http.routers.${STACK_NAME:-sc-hauling}-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${STACK_NAME:-sc-hauling}-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.${STACK_NAME:-sc-hauling}-http.middlewares=${STACK_NAME:-sc-hauling}-redirect

      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-redirect.redirectscheme.permanent=true
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-secure.chain.middlewares=${STACK_NAME:-sc-hauling}-headers,${STACK_NAME:-sc-hauling}-compress
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-headers.headers.frameDeny=true
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${STACK_NAME:-sc-hauling}-compress.compress=true

  database:
    container_name: ${STACK_NAME:-sc-hauling}_database
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-app}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    networks: [app]

volumes:
  database_data:
  sessions_data:

networks:
  app:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-main_traefik}
