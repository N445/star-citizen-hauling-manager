# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Derrière Traefik (TLS terminé par lui) : sans cela Symfony se croit en HTTP et génère des URL http:// (barre de debug
    # bloquée en « contenu mixte », sitemap, redirections). Le conteneur n'est joignable que via Traefik sur un réseau privé.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        session:
            # Volume nommé sessions_data (compose.prod.yaml) : var/ est un tmpfs en prod, les sessions y seraient perdues à chaque mise à jour.
            save_path: /sessions
