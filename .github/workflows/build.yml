name: Image Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    name: Construire et publier l'image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Même format que `make build-prod`.
      - id: sha
        run: echo "court=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance: false — sinon GHCR pousse un index d'attestation, n'y lit pas image.source et ne rattache pas le package au dépôt.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.sha.outputs.court }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/n445/star-citizen-hauling-manager:${{ github.ref_name }}
            ghcr.io/n445/star-citizen-hauling-manager:${{ steps.sha.outputs.court }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
