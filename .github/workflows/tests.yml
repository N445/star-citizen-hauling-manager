name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer l'environnement du runner
        run: |
          docker network create main_traefik
          printf 'APP_UID=%s\nAPP_GID=%s\n' "$(id -u)" "$(id -g)" > .env.local
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Compose ne construit que si l'image manque : chargée ici avec le cache GitHub, `make start` la réutilise.
      - name: Construire l'image de dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: sc-hauling-dev:latest
          load: true
          build-args: |
            APP_UID=${{ env.APP_UID }}
            APP_GID=${{ env.APP_GID }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - run: make start
      - run: make install
      - run: make lint
      - run: make phpunit

      - if: always()
        run: make down
