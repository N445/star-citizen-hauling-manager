name: sc-hauling

services:
  php:
    container_name: sc_hauling_php
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: sc-hauling-dev
    restart: unless-stopped
    user: ${APP_UID:-1000}:${APP_GID:-1000}
    environment:
      SERVER_NAME: ":8000"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      database: { condition: service_healthy }
    networks: [app, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-main_traefik}
      # Noms distincts de ceux de compose.prod.yaml : deux piles qui partagent un nom deviennent un seul service Traefik.
      traefik.http.routers.sc-hauling-dev.rule: Host(`${APP_DOMAIN:-sc-hauling-manager.local}`)
      traefik.http.routers.sc-hauling-dev.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP:-web}
      traefik.http.routers.sc-hauling-dev-https.rule: Host(`${APP_DOMAIN:-sc-hauling-manager.local}`)
      traefik.http.routers.sc-hauling-dev-https.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      traefik.http.routers.sc-hauling-dev-https.tls: "true"
      traefik.http.services.sc-hauling-dev.loadbalancer.server.port: "8000"

  database:
    container_name: sc_hauling_database
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-app}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    networks: [app]

volumes:
  database_data:

networks:
  app:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-main_traefik}
