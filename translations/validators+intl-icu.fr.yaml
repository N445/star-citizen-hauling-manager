        not_blank: Indique la ressource.
    quantity:
        not_null: Indique la quantité.

mission_type:
    direct:
        rule: Une mission directe a un seul lieu de ramassage et un seul lieu de livraison.
    multiple_drop_off:
        rule: Une mission à livraisons multiples a un seul lieu de ramassage et au moins deux lieux de livraison.
    multiple_pick_up:
        rule: Une mission à ramassages multiples a au moins deux lieux de ramassage et un seul lieu de livraison.
